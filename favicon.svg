<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Harvest Deli">
  <defs>
    <radialGradient id="fBg" cx="0.36" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#1d4836"/><stop offset="0.6" stop-color="#10281f"/><stop offset="1" stop-color="#0a1c15"/>
    </radialGradient>
    <linearGradient id="fRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7cf95"/><stop offset="0.5" stop-color="#caa86a"/><stop offset="1" stop-color="#8a6228"/>
    </linearGradient>
    <linearGradient id="fBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dca1"/><stop offset="0.55" stop-color="#d9b36e"/><stop offset="1" stop-color="#b98e47"/>
    </linearGradient>
    <linearGradient id="fShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0"/><stop offset="0.5" stop-color="#fff8e0" stop-opacity="0.85"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fClip"><circle cx="32" cy="32" r="31"/></clipPath>
    <style>
      @keyframes fFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
      @keyframes fWing { from { transform: scaleX(1); } to { transform: scaleX(0.55); } }
      @keyframes fShimmer { 0%,62% { transform: translateX(-46px) rotate(14deg); opacity:0; } 70% { opacity:0.9; } 100% { transform: translateX(46px) rotate(14deg); opacity:0; } }
      .fBee { animation: fFloat 4s ease-in-out infinite; transform-origin: 32px 34px; }
      .fWingL { transform-box: fill-box; transform-origin: 100% 50%; animation: fWing 0.22s ease-in-out infinite alternate; }
      .fWingR { transform-box: fill-box; transform-origin: 0% 50%; animation: fWing 0.22s ease-in-out infinite alternate; }
      .fShim { animation: fShimmer 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .fBee, .fWingL, .fWingR, .fShim { animation: none; } .fShim { opacity: 0; } }
    </style>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#fBg)"/>

  <g class="fBee">
    <ellipse class="fWingL" cx="23" cy="22.5" rx="8.5" ry="5.6" fill="#efd79a" opacity="0.55"/>
    <ellipse class="fWingR" cx="41" cy="22.5" rx="8.5" ry="5.6" fill="#efd79a" opacity="0.55"/>
    <path d="M29.5 16.5C26.5 11 23 11 21.6 13.2" stroke="#d9b36e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M34.5 16.5C37.5 11 41 11 42.4 13.2" stroke="#d9b36e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <rect x="23.5" y="19" width="17" height="31" rx="8.5" fill="url(#fBody)"/>
    <rect x="23.5" y="27.5" width="17" height="3.4" fill="#10281f"/>
    <rect x="23.5" y="35" width="17" height="3.4" fill="#10281f"/>
    <rect x="23.5" y="42.5" width="17" height="3.2" fill="#10281f"/>
  </g>

  <g clip-path="url(#fClip)"><rect class="fShim" x="20" y="-12" width="12" height="88" fill="url(#fShine)"/></g>
  <circle cx="32" cy="32" r="31" fill="none" stroke="url(#fRim)" stroke-width="2"/>
</svg>
