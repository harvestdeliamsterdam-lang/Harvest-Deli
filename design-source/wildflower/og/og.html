<!doctype html><html lang="nl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden;
        background: radial-gradient(90% 120% at 15% 0%, #FBF7EF 0%, #F5EFE4 45%, #EDE3D2 100%); font-family: 'Inter Tight', sans-serif; color: #1F1A14; }
  .photo { position: absolute; right: 0; top: 0; width: 630px; height: 630px; background: url(photo.png) center / cover no-repeat; }
  .photo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #F2EADC 0%, rgba(242,234,220,0) 16%); }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: #8A6228; font-weight: 600; margin-bottom: 30px; }
  .brand span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #B8945A; margin: 0 14px 3px; vertical-align: middle; }
  h1 { font-family: 'General Sans', sans-serif; font-weight: 560; font-size: 64px; line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 18px; }
  .greek { font-family: 'General Sans', sans-serif; font-weight: 500; font-size: 34px; letter-spacing: -0.02em; color: #756859; margin-bottom: 30px; }
  .facts { display: flex; gap: 12px; flex-wrap: wrap; }
  .facts div { font-size: 17px; font-weight: 500; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(138, 98, 40, 0.35); color: #3a3026; background: rgba(250, 246, 238, 0.7); }
  .url { position: absolute; left: 72px; bottom: 44px; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: #5C5247; }
</style></head><body>
<div class="og">
  <div class="photo"></div>
  <div class="text">
    <div class="brand">Harvest Deli<span></span>Griekse honing</div>
    <h1>Griekse<br>Bloesemhoning</h1>
    <div class="greek">Anthómelo · rauw en ongefilterd</div>
    <div class="facts"><div>Mild en bloemig</div><div>Van wilde Griekse bloemen</div></div>
  </div>
  <div class="url">harvestdeli.nl</div>
</div>
</body></html>
